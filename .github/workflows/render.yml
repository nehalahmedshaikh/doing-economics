name: Render and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test helpers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      # Only the statistical helpers in src/ are tested here. The projects
      # themselves are verified by rendering, which needs the datasets.
      - uses: julia-actions/julia-runtest@v1

  render:
    name: Render site
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12"

      - uses: julia-actions/cache@v2

      - uses: julia-actions/julia-buildpkg@v1

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.18"

      # The datasets are committed, so a document whose source changed can be
      # re-executed here rather than failing. The committed _freeze/ cache still
      # serves everything unchanged, which is what keeps this job to a few minutes
      # instead of recompiling the plotting stack on every push.
      - name: Verify data against the manifest
        run: julia --project=. scripts/verify_data.jl

      - name: Render
        run: quarto render --output-dir docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: render
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
