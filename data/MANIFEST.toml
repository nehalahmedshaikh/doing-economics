# Provenance for every dataset this repository uses.
#
# Nothing here is committed to git. `scripts/fetch_data.jl` reads this file and
# downloads each entry into `data/raw/`; `scripts/verify_data.jl` checks what is on
# disk against it.
#
# Fields
#   project      empirical project number the file belongs to
#   dest         path under data/raw/
#   url          direct download location
#   publisher    who produces the data
#   licence      terms the publisher releases it under
#   stable       true  -> upstream file is frozen; a checksum mismatch is an error
#                false -> upstream is reissued over time (e.g. NASA GISS is updated
#                         monthly); `sha256` records the vintage that produced the
#                         committed results, and drift is reported, not fatal
#   vintage      date the recorded checksum was observed
#   manual       true -> registration required, cannot be fetched unattended;
#                        `instructions` explains what to do by hand

# ── Project 1: Measuring climate change ──────────────────────────────────────

[[file]]
project = 1
name = "giss-nh-temperature"
dest = "01/NH.Ts+dSST.csv"
url = "https://data.giss.nasa.gov/gistemp/tabledata_v4/NH.Ts+dSST.csv"
description = """
GISTEMP v4 combined land-surface air and sea-surface water temperature anomalies, \
Northern-Hemisphere mean, by month, season and year, from 1880. Anomalies are \
relative to the 1951-1980 base period. Missing values are coded `***`."""
publisher = "NASA Goddard Institute for Space Studies"
licence = "Public domain (work of the US federal government)"
stable = false
vintage = "2026-09-02"
sha256 = "2dbcf9bcc469f99a35560868f1a0e452e4626acb88bb2076c14b6ad6cab31ab7"
notes = """
GISTEMP is reissued every month, and each release revises the whole series slightly \
as station records are corrected. Figures computed from a later vintage will differ \
from the ones committed here in the last decimal place. The project page states the \
vintage it was rendered against."""

[[file]]
project = 1
name = "noaa-mauna-loa-co2"
dest = "01/1_CO2-data.xlsx"
url = "https://www.core-econ.org/wp-content/uploads/2018/03/1_CO2-data.xlsx"
description = """
Monthly atmospheric CO2 concentration measured at Mauna Loa Observatory, Hawaii, \
from March 1958: monthly average, a seasonally interpolated series, and a \
trend series with the seasonal cycle removed."""
publisher = "NOAA Global Monitoring Laboratory, via CORE Econ"
licence = "NOAA data are public domain; this snapshot is redistributed by CORE Econ"
stable = true
vintage = "2026-09-02"
sha256 = "8efaada2e76bd4774cd57e363b83d54903c1e7ce1bd8a8d425a52e60eaba2c8f"
notes = """
This is the frozen 2018 snapshot the book links to, used so that results here can be \
checked against the book's published solutions. NOAA's live series is at \
https://gml.noaa.gov/webdata/ccgg/trends/co2/co2_mm_mlo.csv and now extends well \
past this file; it is the right source for current work, but it will not reproduce \
the book's numbers."""

# ── Project 2: Collecting and analysing data from experiments ────────────────

[[file]]
project = 2
name = "public-goods-experiment"
dest = "02/public-goods-experiment.xlsx"
url = "https://www.core-econ.org/wp-content/uploads/2022/05/doing-economics-datafile-working-in-excel-project-2.xlsx"
description = """
Average per-period contributions in a public goods game across 16 subject pools, in two \
conditions: without punishment (Figure 3 of Herrmann, Thoni and Gachter 2008) and with \
punishment (Figure 2A). One sheet, two 10x16 blocks - periods 1-10 down, cities across, \
headers on rows 2 and 16."""
publisher = "CORE Econ, from Herrmann, Thoni and Gachter (2008), Science 319(5868)"
licence = "Redistributed by CORE Econ for teaching use; underlying study (c) AAAS"
stable = true
vintage = "2026-09-02"
sha256 = "bd044a94ad3ac53f1c3a85ca2a777cb1931b63cf7347903883b8996127fccba8"
notes = """
The 16 subject pools are cities, not countries: Copenhagen, Dnipropetrovs'k, Minsk, \
St. Gallen, Muscat, Samara, Zurich, Boston, Bonn, Chengdu, Seoul, Riyadh, Nottingham, \
Athens, Istanbul, Melbourne. Because this file is frozen, every figure in Project 2 \
reproduces the book's published solutions exactly."""

# ── Project 3: Measuring the effect of a sugar tax ───────────────────────────

[[file]]
project = 3
name = "berkeley-store-price-survey"
dest = "03/sps_public.xlsx"
url = "https://drive.google.com/uc?export=download&id=1bL84gZfb0OLsIsYe9nfLXSCU1tTxJUQb"
description = """
Berkeley Store Price Survey from Silver et al. (2017): 2,175 shelf-price observations \
across 26 stores and 247 products, in three waves (DEC2014, JUN2015, MAR2015). Two \
sheets - `Data Dictionary` and `Data`. Columns include store_type (1 large supermarket, \
2 small supermarket, 3 pharmacy, 4 gas station), taxed, supp, price_per_oz and \
price_per_oz_c."""
publisher = "UNC Global Food Research Program, via CORE Econ"
licence = "Public-use file released with Silver et al. (2017), PLoS Med 14(4): e1002283"
stable = true
vintage = "2026-09-02"
sha256 = "4fc446cbc56c29a13fd6947cfb9d9622eddae99a4aebd9c7610d16b8452e445c"
notes = """
Hosted on Google Drive rather than by CORE directly, so the URL above is the \
`uc?export=download` form rather than the `/view` share link the book gives. Drive can \
interpose an interstitial page on larger files; this one is small enough to download \
unattended, but the checksum is what confirms a real spreadsheet arrived rather than \
an HTML error page.

This vintage differs from the one the book's solutions were written against in two \
visible ways: the third wave is labelled MAR2015 here and MAR2016 there, and `supp` is \
numeric 0/1 here where the book's code compares it to the string "Standard". The \
published price means still reproduce exactly, so the underlying observations are the \
same."""

[[file]]
project = 3
name = "berkeley-weighted-prices"
dest = "03/public_use_weighted_prices2.dta"
url = "https://www.core-econ.org/wp-content/uploads/2022/06/public_use_weighted_prices2.dta"
description = """
Point-of-sale weighted average prices, 2,728 rows: year, quarter, month, location \
(Berkeley / Non-Berkeley), beverage_group, tax status, price. Used for the \
difference-in-differences comparison in Part 3.2."""
publisher = "UNC Global Food Research Program, via CORE Econ"
licence = "Public-use file released with Silver et al. (2017), PLoS Med 14(4): e1002283"
stable = true
vintage = "2026-09-02"
sha256 = "81884402848faecb1da604f57dfae2a58a068a62fa6158ef968d7855e7b24838"
notes = """
Stata format, release 118, read with ReadStatTables.jl. CORE also publishes this table \
as `doing-economics-project-3-2-datafile.xls`, but that is the legacy OLE2 .xls format \
which XLSX.jl cannot read - it would need LibreOffice or Python to convert. The Stata \
original is what the book's own R walk-through 3.7 uses, and it needs no conversion \
step, so the repository stays pure Julia."""
